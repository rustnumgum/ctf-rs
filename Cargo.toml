[package]
name = "ctf"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Rust CPU/MPI port of the cc4s Cyclops Tensor Framework"

[dependencies]
mpi-sys = "0.2"

[features]
default = ["native-linalg"]
native-linalg = []

[lib]
path = "src/lib.rs"

[[test]]
name = "foundation"
path = "tests/foundation.rs"
harness = false

[[test]]
name = "dense_views"
path = "tests/dense_views.rs"
harness = false

[[test]]
name = "replicated_sum"
path = "tests/replicated_sum.rs"
harness = false

[[test]]
name = "tensor_sum"
path = "tests/tensor_sum.rs"
harness = false

[[test]]
name = "replicated_contraction"
path = "tests/replicated_contraction.rs"
harness = false

[[test]]
name = "ctr_2d"
path = "tests/ctr_2d.rs"
harness = false

[[test]]
name = "tensor_gemm"
path = "tests/tensor_gemm.rs"
harness = false
required-features = ["native-linalg"]

[[test]]
name = "custom_reduce"
path = "tests/custom_reduce.rs"
harness = false

[[test]]
name = "algebra_sum"
path = "tests/algebra_sum.rs"
harness = false

[[test]]
name = "complex_scalar"
path = "tests/complex_scalar.rs"
harness = false

[[test]]
name = "sum_remap"
path = "tests/sum_remap.rs"
harness = false

[[test]]
name = "algebra_contraction"
path = "tests/algebra_contraction.rs"
harness = false
