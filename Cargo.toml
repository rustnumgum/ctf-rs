[package]
name = "ctf"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Rust CPU/MPI port of the cc4s Cyclops Tensor Framework"

[dependencies]
mpi-sys = "0.2"

[features]
default = ["native-linalg", "native-scalapack"]
native-linalg = []
native-scalapack = ["native-linalg"]

